[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboardforge-core"
version = "0.1.0"
description = "KeyboardForge core keyboard layout engine (model, validator, XKB parser/generator)"
authors = [{ name = "gatchez" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["keyboardforge_core*"]
